spring:
  application:
    name: M2E-DASHBOARD

  jpa:
    properties:
      hibernate:
        generate_statistics: true
        dialect: org.hibernate.dialect.Oracle12cDialect

  cloud:
    discovery:
      enabled: true
    gateway:
      discovery:
        locator:
          enabled: true

  data:
    redis:
      host: 172.31.196.41
      port: 6379
      timeout: 2s
      password: ENC(ttLg0q1psDkx+YSijlcsHTEysFNoZV3iFHouxEXFw3+4hQ7PvHAqk17UXe+bFJLk)

server:
  port: 9015
  servlet:
    context-path: /dashboard
  error:
    include-message: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://10.235.83.32:7012/eureka}
  instance:
    preferIpAddress: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    tagsSorter: alpha

entitlement:
  enabled: false

resilience4j:
  timelimiter:
    instances:
      esbClientService:
        timeout-duration: 59s
        cancel-running-future: true

cache:
  ttl: 5m

logger:
  path: ${user.home}/app/cfo/dashboard/logs

logstash:
  host: 10.235.83.32:5000

m2e:
  implementation: production

  integration:
    eim:
      url: https://172.31.196.126:8445
      uri:
        einvoice:
          list: /eim-ws/api/v1/einvoice/list-e-invoice
          download: /eim-ws/api/v1/einvoice/download
          linkStatus: /eim-ws/api/v1/einvoices/{gcif}/link-status
          updateLinkStatus: /eim-ws/api/v1/einvoices/update-link-status

  perf:
    monitor:
      elapse:
        time:
          enable: true
          package:
            includes: com.m2e.dashboard.repository
            excludes: com.m2e.dashboard.service.ESBClientService